site_name: KSBravo
site_description: KSBravo - custom nextbots, NPCs and tools for Garry's Mod and s&box. Commissions open.
site_url: https://ks-bravo.com/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/logo.webp
  favicon: img/icono.webp
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: slate
    primary: black
    accent: deep orange
  features:
    - navigation.top
    - content.tabs.link

nav:
  - Home: index.md
  - Work in Progress: progress.md
  - Commissions: commissions.md
  - Work: work.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: es
          name: Español
          nav_translations:
            Home: Inicio
            Work in Progress: Trabajo en Progreso
            Commissions: Encargos
            Work: Trabajos

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/progress-data.js
  - javascripts/progress.js

